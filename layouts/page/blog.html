{{ define "main" }}

<ul>
  {{- range site.Pages.GroupByDate "2006" -}}
    {{- range .Pages -}}
    {{ if eq .Type "post" }}
      <li>
        <div class="title"><strong>
          <a href="{{- .RelPermalink -}}">
            {{- .Title -}}
          </a></strong></div>
          <div class="date">{{ time.Format .Site.Params.date_format .PublishDate }}</div>
	  <br/>
      </li>
    {{- end -}}
    {{- end -}}
  {{- end -}}
</ul>

{{ end }}
